{% extends "base.html" %}
{% block title %}{{ title }} · Tareas{% endblock %}
{% block content %}
<section class="form-card">
  <a class="back" href="{% url 'dashboard' %}">← Volver al panel</a>
  <h1>{{ title }}</h1>
  <form method="post" class="stacked-form">{% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions"><a class="button secondary" href="{% url 'dashboard' %}">Cancelar</a><button class="button primary">Guardar</button></div>
  </form>
</section>
{% endblock %}
